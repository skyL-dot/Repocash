<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: iPad landscape. Slim tab rail on the left, product catalog in the middle, order panel on the right.
     In portrait the order panel becomes a bottom sheet opened from a bar. */
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F4F7F6; --ink:#15211D; --ink-2:#56665F; --line:#D5DDD9;
  --accent:#0D6E5B; --accent-ink:#FFFFFF; --accent-soft:#D9EEE8; --bar:#A9D2C6;
  --warn:#8F5400; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#FBE0DD; --bad-ink:#FFFFFF;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#171F1C; --surface-2:#1D2723; --ink:#E6EFEB; --ink-2:#9BAEA7; --line:#2A3631;
    --accent:#3DBE9C; --accent-ink:#06261E; --accent-soft:#173B31; --bar:#2C6B5A;
    --warn:#F2B45A; --warn-soft:#3A2B10; --bad:#FF8F82; --bad-soft:#3E1B17; --bad-ink:#33110D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#171F1C; --surface-2:#1D2723; --ink:#E6EFEB; --ink-2:#9BAEA7; --line:#2A3631;
  --accent:#3DBE9C; --accent-ink:#06261E; --accent-soft:#173B31; --bar:#2C6B5A;
  --warn:#F2B45A; --warn-soft:#3A2B10; --bad:#FF8F82; --bad-soft:#3E1B17; --bad-ink:#33110D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;overflow:hidden;-webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
small{color:var(--ink-2);font-size:12.5px}
h2{margin:0;font-size:19px}

.app{height:100%;display:grid;grid-template-columns:78px minmax(0,1fr);gap:14px}
.rail{display:flex;flex-direction:column;gap:6px;min-height:0}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:68px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--ink-2);font-size:12px;font-weight:600}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--surface);border-color:var(--line);color:var(--accent)}
.tab .dot{position:absolute;top:8px;right:14px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--bad-ink);font-size:11px;display:grid;place-items:center;font-family:var(--f-mono)}
.mode{margin-top:auto;text-align:center;font-size:11px;color:var(--ink-2);padding:6px 0}
.mode b{display:block;color:var(--ink)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.loading{margin:auto;color:var(--ink-2)}

.inp{height:46px;width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 14px;font-size:16px}
.inp::placeholder{color:var(--ink-2);opacity:.8}
select.inp{appearance:auto}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;white-space:nowrap}
.btn.sm{height:38px;padding:0 12px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.btn.big{height:56px;font-size:17px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.98)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.seg button{flex:1;min-width:0;height:42px;border:0;background:transparent;color:var(--ink-2);font-weight:600;padding:0 8px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-2);padding:36px 16px;border:1px dashed var(--line);border-radius:14px;background:var(--surface-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:12px}

/* Kasir */
.pos{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px}
.catalog{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;padding:8px 8px 16px 2px}
.prod{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-width:0}
.prod.in{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.prod:disabled{opacity:.5}
.prod:active:not(:disabled){transform:scale(.97)}
.p-cat{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.p-name{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.p-foot{display:flex;justify-content:space-between;align-items:center;gap:6px}
.p-price{font-family:var(--f-mono);font-weight:500}
.p-stock{font-size:12px;color:var(--ink-2)}
.p-stock.warn{color:var(--warn);font-weight:600}
.p-stock.bad{color:var(--bad);font-weight:600}
.qb{position:absolute;top:-8px;right:-8px;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 13px var(--f-mono)}

.cart{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.cart-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cart-h .x2{display:none}
.lines{flex:1;min-height:0;overflow:auto;padding:0 16px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ln-n{font-weight:600;overflow-wrap:anywhere}
.ln-n small{display:block;font-weight:400}
.ln-t{font-family:var(--f-mono);font-weight:500;text-align:right}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;justify-self:start}
.step button{width:42px;height:38px;border:0;background:var(--surface-2);font-size:20px;line-height:1}
.step input{width:60px;min-width:0;height:38px;padding:0;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;background:var(--surface);color:var(--ink);text-align:center;font:600 16px var(--f-mono)}
.link{border:0;background:transparent;color:var(--ink-2);text-decoration:underline;justify-self:end;height:38px;padding:0 4px}
.sum{padding:12px 16px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row.t{align-items:baseline}
.total{font:700 28px var(--f-mono);letter-spacing:-.01em}
.disc{display:flex;gap:8px;align-items:center}
.disc .seg{width:96px;flex:none}
.disc .inp{height:42px;width:104px;text-align:right}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:500 14px var(--f-mono)}
.chg{font-family:var(--f-mono);font-weight:600}
.chg.short{color:var(--warn)}
.cartbar,.scrim{display:none}

/* Daftar & tabel */
.head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.head h1{margin:0;font-size:22px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex:1 1 320px;justify-content:flex-end}
.tools .inp{flex:1 1 200px;max-width:320px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.kpi small{display:block;letter-spacing:.05em;text-transform:uppercase;font-size:11px}
.kpi b{display:block;font:600 20px var(--f-mono);margin-top:2px;overflow-wrap:anywhere}
.scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.tr{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr.th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);padding-block:8px;background:var(--surface-2);border-radius:14px 14px 0 0}
.c-name{min-width:0;overflow-wrap:anywhere}
.c-name small{display:block}
.c-act{display:flex;gap:6px}
.banner{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft)}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:150px;padding:14px 14px 10px}
.col{display:flex;flex-direction:column;gap:4px;min-width:0;height:100%}
.col .v{font:500 11px var(--f-mono);text-align:center;color:var(--ink-2);height:14px;white-space:nowrap}
.col .track{flex:1;position:relative;border-bottom:1px solid var(--line)}
.col .track i{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,46px);background:var(--bar);border-radius:6px 6px 0 0}
.col.now .track i{background:var(--accent)}
.col .d{font-size:11.5px;text-align:center;color:var(--ink-2)}
.ur{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1.5fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.ur:last-child{border-bottom:0}
.ur.off .c-name{opacity:.6}
.chk{display:flex;gap:10px;align-items:center;font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.mx{width:100%;border-collapse:collapse;font-size:14px}
.mx th,.mx td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:center}
.mx th:first-child,.mx td:first-child{text-align:left}
.mx tbody tr:last-child td{border-bottom:0}
.mx thead th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
.mx .y{color:var(--accent);font-weight:700}.mx .n{color:var(--ink-2);opacity:.55}
.srow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent}
.srow:last-child{border-bottom:0}
.srow .no{font:600 14px var(--f-mono)}
.srow.void .amt{text-decoration:line-through;color:var(--ink-2)}
.amt{font:600 15px var(--f-mono);text-align:right}
.form{display:grid;gap:12px;max-width:680px;padding:16px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:grid;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500;min-width:0}
.f.full{grid-column:1/-1}
.f .inp{color:var(--ink)}

/* Modal */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(8,14,12,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(520px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .sp{flex:1}
.hint{margin:0;font-size:13px;color:var(--ink-2)}
.rwrap{background:var(--surface-2);border-radius:12px;padding:12px;overflow:auto;display:flex;justify-content:center}
.rwrap textarea{width:100%;min-height:240px;font:12px/1.4 var(--f-mono);border:0;background:transparent;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:min(92vw,440px);font-weight:500;text-align:center}
#printArea{display:none}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{display:inline-flex;align-items:center;justify-content:center}
.reccode{font:700 26px var(--f-mono);letter-spacing:.06em;text-align:center;padding:16px 8px;border:2px dashed var(--accent);border-radius:14px;background:var(--accent-soft);user-select:all;-webkit-user-select:all}

@media (max-width:900px){
  .pos{grid-template-columns:minmax(0,1fr)}
  .grid{padding-bottom:92px}
  .cart{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:88%;border-radius:18px 18px 0 0;border-bottom:0;transform:translateY(105%);transition:transform .2s ease;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .cart.open{transform:none}
  .cart-h .x2{display:inline-block}
  .cartbar{position:fixed;z-index:30;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:58px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .cartbar .mono{font-size:18px}
  .scrim.on{display:block;position:fixed;inset:0;z-index:35;background:rgba(8,14,12,.45)}
}
@media (max-width:700px){
  .tr{grid-template-columns:minmax(0,1fr) auto}
  .tr.th,.c-cat{display:none}
  .tr .c-price{grid-column:1}
  .c-act{grid-column:2;grid-row:1 / span 2}
  .ur{grid-template-columns:minmax(0,1fr) auto}
  .ur .c-last{grid-column:1}
  .ur .c-act{grid-row:1 / span 3}
  .srow{grid-template-columns:minmax(0,1fr) auto}
  .srow .mid{grid-column:1;grid-row:2}
  .srow .amt{grid-row:1 / span 2;grid-column:2}
}
@media (max-width:600px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px}
  .rail{flex-direction:row}
  .tab{flex:1;height:54px;font-size:11.5px;gap:2px}
  .tab svg{width:20px;height:20px}
  .tab .dot{top:4px;right:10px}
  .mode{display:none}
  .fgrid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  html,body{height:auto;overflow:visible;background:#fff;padding:0}
  body>:not(#printArea){display:none!important}
  #printArea{display:block}
}
</style>
<style id="receipt-css">
.receipt{font:12px/1.4 'IBM Plex Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace;width:var(--paper,58mm);max-width:100%;background:#fff;color:#111;padding:4mm 3mm;margin:0 auto}
.receipt hr{border:0;border-top:1px dashed #111;margin:6px 0}
.receipt .r-c{text-align:center;overflow-wrap:anywhere}
.receipt .r-b{font-weight:700}
.receipt .r-line{display:flex;justify-content:space-between;gap:8px}
.receipt .r-line span:first-child{min-width:0;overflow-wrap:anywhere}
.receipt .r-item{margin-bottom:4px;overflow-wrap:anywhere}
.receipt .r-total{font-size:14px}
</style>

  <nav id="rail" class="rail" aria-label="Menu utama"></nav>
  <main id="main" class="main"><div class="loading">Memuat data…</div></main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="printArea"></div>
<input id="restoreFile" type="file" accept=".json,application/json" hidden>

<script>
/* ===== Server mini di dalam iPad =====
   Meniru API server Kasirku, tetapi data disimpan di IndexedDB iPad ini.
   Tampilan aplikasi sama persis dengan versi server; hanya "server"-nya berjalan di sini. */
(function(){
'use strict';
const realFetch=window.fetch.bind(window);
const ROLES=['owner','manager','cashier'];
const PERMS={
  owner:['sell','products','restock','void','history_all','profit','settings','users','backup'],
  manager:['sell','products','restock','void','history_all','profit'],
  cashier:['sell']
};
const METHODS=['Tunai','QRIS','Transfer','Debit'];
const DEFAULTS={store:'Toko Saya',addr:'Jl. Contoh No. 1',phone:'',footer:'Terima kasih, sampai jumpa lagi!',tax:0,paper:58,prefix:'INV'};
const SAMPLE=[["Kopi Susu Gula Aren", "MN-001", "Minuman", 18000, 8000, 40, 10], ["Es Teh Manis", "MN-002", "Minuman", 6000, 2000, 60, 15], ["Air Mineral 600 ml", "MN-003", "Minuman", 4000, 2500, 48, 12], ["Teh Botol", "MN-004", "Minuman", 5500, 3800, 24, 8], ["Indomie Goreng", "MK-001", "Makanan", 3500, 2800, 80, 20], ["Nasi Goreng Spesial", "MK-002", "Makanan", 22000, 11000, 20, 5], ["Roti Bakar Cokelat", "MK-003", "Makanan", 15000, 7000, 18, 5], ["Pisang Goreng", "CM-001", "Camilan", 10000, 4500, 25, 8], ["Keripik Singkong", "CM-002", "Camilan", 12000, 7500, 6, 8], ["Kacang Atom", "CM-003", "Camilan", 8000, 5000, 30, 10], ["Sabun Mandi", "RT-001", "Rumah Tangga", 4500, 3200, 15, 5], ["Tisu Wajah", "RT-002", "Rumah Tangga", 9000, 6000, 0, 5]];
const MIN_PW=6, IDLE=30*864400000, ITERS=150000;
const USERNAME_RE=/^[a-z0-9._-]{3,30}$/;

class ApiError extends Error{constructor(status,message,extra){super(message);this.status=status;this.extra=extra||{};}}
const ms=()=>Date.now();
const sleep=t=>new Promise(r=>setTimeout(r,t));
function hex(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');}
const newId=()=>hex(6);
const b64=u8=>btoa(String.fromCharCode.apply(null,u8));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

/* ---------- penyimpanan ---------- */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('kasirku',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){const db=await idbOpen();try{return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}finally{db.close();}}
async function idbPut(k,v){const db=await idbOpen();try{await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}finally{db.close();}}

let DB=null, stale=false, memOnly=false;
const bc=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('kasirku-db'):null;
if(bc)bc.onmessage=()=>{stale=true;};
function normalize(d){
  d=d&&typeof d==='object'?d:{};
  const meta=Object.assign({rev:1,seeded:false,lastBackup:0,recovery:null},d.meta||{});
  const db={products:Array.isArray(d.products)?d.products:[],sales:Array.isArray(d.sales)?d.sales:[],
    settings:Object.assign({},DEFAULTS,d.settings||{}),users:Array.isArray(d.users)?d.users:[],sessions:d.sessions||{},meta};
  if(!meta.seeded&&!db.products.length&&!db.sales.length){
    const now=ms();
    SAMPLE.forEach(s=>db.products.push({id:newId(),name:s[0],sku:s[1],category:s[2],price:s[3],cost:s[4],stock:s[5],min:s[6],example:true,updated:now}));
  }
  meta.seeded=true;
  db.sales.sort((a,b)=>b.ts-a.ts);
  return db;
}
async function load(){
  let d=null;
  try{d=await idbGet('state');}catch(e){memOnly=true;}
  DB=normalize(d);stale=false;
  window.__memOnly=memOnly;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if(!d)persist();
}
async function persist(){
  try{await idbPut('state',DB);memOnly=false;}catch(e){memOnly=true;}
  window.__memOnly=memOnly;
  try{if(bc)bc.postMessage(1);}catch(e){}
}
let chain=Promise.resolve();
function locked(fn){const run=chain.then(fn,fn);chain=run.catch(()=>{});return run;}
let ready=null;
async function fresh(){if(!ready)ready=load();await ready;if(stale)await load();}
function write(fn,bump){
  return locked(async()=>{await fresh();const out=await fn();if(bump!==false)DB.meta.rev++;await persist();return out;});
}

/* ---------- util ---------- */
function toInt(v,label,min){
  min=min==null?0:min;
  const n=Math.trunc(Number(String(v==null?'':v).replace(',','.').trim()||0));
  if(!isFinite(n))throw new ApiError(400,(label||'Nilai')+' harus berupa angka');
  if(n<min)throw new ApiError(400,(label||'Nilai')+' tidak boleh kurang dari '+min);
  return n;
}
const round=x=>Math.floor(x+0.5);
const cleanName=v=>{const n=String(v||'').split(/\s+/).filter(Boolean).join(' ').slice(0,60);if(!n)throw new ApiError(400,'Nama lengkap wajib diisi');return n;};
const cleanUser=v=>{const u=String(v||'').trim().toLowerCase();if(!USERNAME_RE.test(u))throw new ApiError(400,'Username 3 sampai 30 karakter: huruf kecil, angka, titik, strip, atau garis bawah');return u;};
function checkPw(pw){
  if(pw.length<MIN_PW)throw new ApiError(400,'Kata sandi minimal '+MIN_PW+' karakter');
  if(pw.length>128)throw new ApiError(400,'Kata sandi terlalu panjang (maksimal 128 karakter)');
}
function needCrypto(){
  if(!(window.crypto&&crypto.subtle))throw new ApiError(500,'Peramban ini tidak mendukung penyimpanan kata sandi aman. Buka aplikasi lewat alamat https.');
}
async function derive(pw,salt,iters){
  needCrypto();
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iters},key,256));
}
async function hashPw(pw){const salt=crypto.getRandomValues(new Uint8Array(16));const dk=await derive(pw,salt,ITERS);return 'pbkdf2$'+ITERS+'$'+b64(salt)+'$'+b64(dk);}
async function verifyPw(pw,stored){
  try{
    const p=String(stored).split('$');const dk=await derive(pw,unb64(p[2]),parseInt(p[1],10));const ref=unb64(p[3]);
    if(dk.length!==ref.length)return false;let d=0;for(let i=0;i<dk.length;i++)d|=dk[i]^ref[i];return d===0;
  }catch(e){return false;}
}
let penal=Promise.resolve();
function penalize(){const p=penal.then(()=>sleep(1000));penal=p;return p;}
const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function makeRecovery(){const a=new Uint8Array(12);crypto.getRandomValues(a);let s='';for(let i=0;i<12;i++){s+=ALPHA[a[i]%ALPHA.length];if(i%4===3&&i<11)s+='-';}return s;}
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

/* ---------- sesi & akun ---------- */
const meDict=u=>({id:u.id,username:u.username,name:u.name,role:u.role,perms:PERMS[u.role].slice().sort()});
function createSession(uid){
  const tok=hex(32),now=ms();
  DB.sessions[tok]={uid,created:now,last:now};
  const mine=Object.keys(DB.sessions).filter(t=>DB.sessions[t].uid===uid).sort((a,b)=>DB.sessions[b].last-DB.sessions[a].last);
  mine.slice(10).forEach(t=>delete DB.sessions[t]);
  return tok;
}
function userFromToken(tok){
  const s=tok&&DB.sessions[tok];if(!s)return null;
  const u=DB.users.find(x=>x.id===s.uid);if(!u||!u.active)return null;
  const now=ms();
  if(now-s.last>IDLE){delete DB.sessions[tok];persist();return null;}
  if(now-s.last>600000){s.last=now;persist();}
  return u;
}
const dropSessions=uid=>Object.keys(DB.sessions).forEach(t=>{if(DB.sessions[t].uid===uid)delete DB.sessions[t];});
const userRow=u=>({id:u.id,username:u.username,name:u.name,role:u.role,active:!!u.active,createdAt:u.createdAt,lastLogin:u.lastLogin||null,
  sessions:Object.keys(DB.sessions).filter(t=>DB.sessions[t].uid===u.id).length});
const otherOwners=uid=>DB.users.filter(u=>u.role==='owner'&&u.active&&u.id!==uid).length;

/* ---------- data toko ---------- */
const prodOut=(p,withCost)=>({id:p.id,name:p.name,sku:p.sku||'',category:p.category||'Lainnya',price:p.price,cost:withCost?(p.cost||0):0,stock:p.stock,min:p.min||0,example:!!p.example});
function saleOut(s,withCost){
  return Object.assign({},s,{items:s.items.map(i=>Object.assign({},i,{cost:withCost?(i.cost||0):0}))});
}
function nextNo(prefix,ts,tz){
  const d=new Date(ts-tz*60000);
  const pre=prefix+'-'+String(d.getUTCFullYear()%100).padStart(2,'0')+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')+'-';
  const used=new Set(DB.sales.map(s=>s.no));
  let n=DB.sales.filter(s=>String(s.no).indexOf(pre)===0).length+1;
  while(used.has(pre+String(n).padStart(3,'0')))n++;
  return pre+String(n).padStart(3,'0');
}
function createSale(b,user){
  const withCost=PERMS[user.role].indexOf('profit')>=0;
  const raw=b.items;
  if(!Array.isArray(raw)||!raw.length)throw new ApiError(400,'Pesanan kosong');
  if(METHODS.indexOf(b.method)<0)throw new ApiError(400,'Metode pembayaran tidak valid');
  const merged=new Map();
  raw.forEach(it=>{
    if(!it||typeof it!=='object')throw new ApiError(400,'Data pesanan tidak valid');
    const pid=String(it.pid||'');const q=toInt(it.qty,'Jumlah',1);merged.set(pid,(merged.get(pid)||0)+q);
  });
  let sid=String(b.id||'');if(!/^[A-Za-z0-9_-]{6,40}$/.test(sid))sid=newId();
  let tz=parseInt(b.tz,10);if(!isFinite(tz))tz=0;tz=Math.max(-840,Math.min(840,tz));
  const done=DB.sales.find(s=>s.id===sid);
  if(done)return saleOut(done,withCost);
  const st=DB.settings,ts=ms();
  const lines=[];let sub=0;
  merged.forEach((qty,pid)=>{
    const p=DB.products.find(x=>x.id===pid);
    if(!p)throw new ApiError(409,'Ada produk yang sudah dihapus. Muat ulang halaman.',{refresh:true});
    if(p.stock<qty)throw new ApiError(409,'Stok '+p.name+' tinggal '+p.stock,{refresh:true});
    lines.push({p,qty});sub+=p.price*qty;
  });
  const dval=toInt(b.discVal||0,'Diskon');
  const disc=b.discType==='pct'?round(sub*Math.min(100,dval)/100):Math.min(sub,dval);
  const base=sub-disc,rate=parseFloat(st.tax)||0,tax=round(base*rate/100),total=base+tax;
  let paid;
  if(b.method==='Tunai'){paid=toInt(b.paid||0,'Uang diterima');if(paid<total)throw new ApiError(400,'Uang diterima kurang dari total');}
  else paid=total;
  const no=nextNo(st.prefix||'INV',ts,tz);
  const items=lines.map(l=>{l.p.stock-=l.qty;l.p.updated=ts;return {pid:l.p.id,name:l.p.name,sku:l.p.sku||'',price:l.p.price,cost:l.p.cost||0,qty:l.qty};});
  const sale={id:sid,no,ts,items,subtotal:sub,discount:disc,taxRate:rate,tax,total,method:b.method,paid,change:Math.max(0,paid-total),
    void:false,voidTs:null,cashier:user.name,cashierId:user.id,voidBy:'',
    st:{store:st.store,addr:st.addr,phone:st.phone,footer:st.footer,paper:st.paper}};
  DB.sales.unshift(sale);DB.sales.sort((a,b)=>b.ts-a.ts);
  return saleOut(sale,withCost);
}
function voidSale(sid,user){
  const s=DB.sales.find(x=>x.id===sid);
  if(!s)throw new ApiError(404,'Transaksi tidak ditemukan');
  if(s.void)throw new ApiError(409,'Transaksi sudah dibatalkan');
  s.void=true;s.voidTs=ms();s.voidBy=user.name;
  s.items.forEach(i=>{const p=DB.products.find(x=>x.id===i.pid);if(p){p.stock+=i.qty;p.updated=ms();}});
  return saleOut(s,PERMS[user.role].indexOf('profit')>=0);
}
function saveProduct(b){
  const name=String(b.name||'').trim().slice(0,120);
  if(!name)throw new ApiError(400,'Nama produk wajib diisi');
  const price=toInt(b.price,'Harga jual');if(price<=0)throw new ApiError(400,'Harga jual harus lebih dari 0');
  const cost=toInt(b.cost||0,'Harga modal'),stock=toInt(b.stock||0,'Stok'),min=toInt(b.min||0,'Batas stok');
  const sku=String(b.sku||'').trim().slice(0,40),cat=(String(b.category||'').trim()||'Lainnya').slice(0,40);
  let pid=String(b.id||'').trim();
  if(pid&&!/^[A-Za-z0-9_-]{1,40}$/.test(pid))throw new ApiError(400,'ID produk tidak valid');
  let p=pid?DB.products.find(x=>x.id===pid):null;
  if(p){Object.assign(p,{name,sku,category:cat,price,cost,stock,min,updated:ms()});}
  else{p={id:pid||newId(),name,sku,category:cat,price,cost,stock,min,example:false,updated:ms()};DB.products.push(p);}
  return prodOut(p,true);
}
function saveSettings(b){
  let tax=parseFloat(String(b.tax==null?0:b.tax).replace(',','.'));if(!isFinite(tax))tax=0;
  const prefix=String(b.prefix||'').replace(/[^A-Za-z0-9]/g,'').slice(0,6).toUpperCase()||'INV';
  DB.settings={store:(String(b.store||'').trim()||'Toko Saya').slice(0,80),addr:String(b.addr||'').trim().slice(0,160),
    phone:String(b.phone||'').trim().slice(0,40),footer:String(b.footer||'').trim().slice(0,160),
    tax:Math.max(0,Math.min(100,tax)),paper:String(b.paper)==='80'?80:58,prefix};
  return DB.settings;
}

/* ---------- cadangan ---------- */
function backupJson(){
  DB.meta.lastBackup=ms();
  const data={app:'kasirku',version:2,exportedAt:ms(),products:DB.products,sales:DB.sales,settings:DB.settings,
    users:DB.users,recovery:DB.meta.recovery};
  return new Blob([JSON.stringify(data)],{type:'application/json'});
}
function parseBackup(text){
  let d=null;try{d=JSON.parse(text);}catch(e){}
  if(!d||d.app!=='kasirku'||!Array.isArray(d.products)||!Array.isArray(d.sales))throw new ApiError(400,'File ini bukan cadangan Kasirku');
  const okP=d.products.every(p=>p&&typeof p==='object'&&typeof p.id==='string'&&typeof p.name==='string'&&isFinite(p.price)&&isFinite(p.stock));
  const okS=d.sales.every(s=>s&&typeof s==='object'&&typeof s.id==='string'&&Array.isArray(s.items)&&isFinite(s.total)&&isFinite(s.ts));
  if(!okP||!okS)throw new ApiError(400,'Isi file cadangan rusak atau tidak lengkap');
  return d;
}
async function saveSafety(){try{await idbPut('safety',{at:ms(),state:DB});}catch(e){}}

/* ---------- router ---------- */
async function handle(m,path,b,raw,tok){
  await fresh();
  if(m==='GET'&&path==='/api/auth/status')
    return {needsSetup:DB.users.length===0,needsCode:false,store:DB.settings.store,minPassword:MIN_PW};
  if(m==='POST'&&path==='/api/auth/setup'){
    return write(async()=>{
      if(DB.users.length)throw new ApiError(409,'Akun pemilik sudah dibuat. Silakan masuk.');
      const name=cleanName(b.name),username=cleanUser(b.username),pw=String(b.password||'');checkPw(pw);
      const h=await hashPw(pw),code=makeRecovery(),ch=await hashPw(normCode(code));
      const u={id:newId(),username,name,role:'owner',pw:h,active:1,createdAt:ms(),lastLogin:ms()};
      DB.users.push(u);DB.meta.recovery=ch;
      return {token:createSession(u.id),me:meDict(u),recovery:code};
    },false);
  }
  if(m==='POST'&&path==='/api/auth/login'){
    const username=String(b.username||'').trim().toLowerCase(),pw=String(b.password||'');
    const u=username?DB.users.find(x=>x.username===username):null;
    const ok=pw.length<=128&&u?await verifyPw(pw,u.pw):false;
    if(!(u&&ok)){await penalize();throw new ApiError(401,'Username atau kata sandi salah');}
    if(!u.active)throw new ApiError(403,'Akun ini dinonaktifkan. Hubungi pemilik toko.');
    return write(()=>{const t=createSession(u.id);u.lastLogin=ms();return {token:t,me:meDict(u)};},false);
  }
  if(m==='POST'&&path==='/api/auth/recover'){
    const username=String(b.username||'').trim().toLowerCase();
    const u=DB.users.find(x=>x.username===username&&x.role==='owner');
    const ok=u&&DB.meta.recovery?await verifyPw(normCode(b.code),DB.meta.recovery):false;
    if(!ok){await penalize();throw new ApiError(401,'Username pemilik atau kode pemulihan salah');}
    const pw=String(b.password||'');checkPw(pw);
    const h=await hashPw(pw),code=makeRecovery(),ch=await hashPw(normCode(code));
    return write(()=>{u.pw=h;u.active=1;dropSessions(u.id);DB.meta.recovery=ch;u.lastLogin=ms();
      return {token:createSession(u.id),me:meDict(u),recovery:code};},false);
  }
  if(m==='POST'&&path==='/api/auth/restore'){
    if(DB.users.length)throw new ApiError(409,'Pemulihan dari layar ini hanya untuk iPad yang belum punya akun.');
    const d=parseBackup(await raw.text());
    return write(()=>{
      DB.products=d.products;DB.sales=d.sales.slice().sort((a,b)=>b.ts-a.ts);DB.settings=Object.assign({},DEFAULTS,d.settings||{});
      DB.users=Array.isArray(d.users)?d.users:[];DB.sessions={};DB.meta.recovery=d.recovery||null;
      return {ok:true,products:d.products.length,sales:d.sales.length,users:DB.users.length};
    });
  }

  const user=userFromToken(tok);
  if(!user)throw new ApiError(401,'Sesi berakhir, silakan masuk lagi',{auth:true});
  const perms=PERMS[user.role];
  const need=p=>{if(perms.indexOf(p)<0)throw new ApiError(403,'Akun Anda tidak punya akses untuk ini');};
  const withCost=perms.indexOf('profit')>=0;

  if(m==='GET'&&path==='/api/rev')return {rev:DB.meta.rev};
  if(m==='GET'&&path==='/api/state'){
    const all=perms.indexOf('history_all')>=0;
    const rows=(all?DB.sales:DB.sales.filter(s=>s.cashierId===user.id)).slice(0,1000);
    return {rev:DB.meta.rev,me:meDict(user),products:DB.products.map(p=>prodOut(p,withCost)),sales:rows.map(s=>saleOut(s,withCost)),
      settings:DB.settings,lastBackup:DB.meta.lastBackup||0};
  }
  if(m==='POST'&&path==='/api/auth/logout')return write(()=>{delete DB.sessions[tok];return {ok:true};},false);
  if(m==='POST'&&path==='/api/me/password'){
    const cur=String(b.current||''),nw=String(b.password||'');
    if(cur.length>128||!(await verifyPw(cur,user.pw))){await penalize();throw new ApiError(401,'Kata sandi saat ini salah');}
    checkPw(nw);const h=await hashPw(nw);
    return write(()=>{user.pw=h;Object.keys(DB.sessions).forEach(t=>{if(DB.sessions[t].uid===user.id&&t!==tok)delete DB.sessions[t];});return {ok:true};},false);
  }
  if(m==='POST'&&path==='/api/me/recovery'){
    need('users');
    if(!(await verifyPw(String(b.current||''),user.pw))){await penalize();throw new ApiError(401,'Kata sandi saat ini salah');}
    const code=makeRecovery(),ch=await hashPw(normCode(code));
    return write(()=>{DB.meta.recovery=ch;return {recovery:code};},false);
  }
  if(m==='GET'&&path==='/api/backup'){need('backup');return write(()=>backupJson(),false);}
  if(m==='POST'&&path==='/api/restore'){
    need('backup');
    const d=parseBackup(await raw.text());
    return write(async()=>{
      await saveSafety();
      DB.products=d.products;DB.sales=d.sales.slice().sort((a,b)=>b.ts-a.ts);DB.settings=Object.assign({},DEFAULTS,d.settings||{});
      return {ok:true,products:d.products.length,sales:d.sales.length,safety:'tersimpan di iPad'};
    });
  }

  if(m==='POST'&&path==='/api/products'){need('products');return write(()=>saveProduct(b));}
  let r=path.match(/^\/api\/products\/([A-Za-z0-9_-]{1,40})\/adjust$/);
  if(m==='POST'&&r){need('restock');return write(()=>{
    const delta=parseInt(b.delta,10);if(!isFinite(delta))throw new ApiError(400,'Jumlah stok tidak valid');
    const p=DB.products.find(x=>x.id===r[1]);if(!p)throw new ApiError(404,'Produk tidak ditemukan');
    p.stock=Math.max(0,p.stock+delta);p.updated=ms();return prodOut(p,withCost);});}
  r=path.match(/^\/api\/products\/([A-Za-z0-9_-]{1,40})$/);
  if(m==='DELETE'&&r){need('products');return write(()=>{DB.products=DB.products.filter(x=>x.id!==r[1]);return {ok:true};});}
  if(m==='POST'&&path==='/api/seed'){need('products');return write(()=>{const now=ms();
    SAMPLE.forEach(s=>DB.products.push({id:newId(),name:s[0],sku:s[1],category:s[2],price:s[3],cost:s[4],stock:s[5],min:s[6],example:true,updated:now}));return {ok:true};});}
  if(m==='DELETE'&&path==='/api/examples'){need('products');return write(()=>{DB.products=DB.products.filter(p=>!p.example);return {ok:true};});}

  if(m==='POST'&&path==='/api/sales'){need('sell');return write(()=>createSale(b,user));}
  r=path.match(/^\/api\/sales\/([A-Za-z0-9_-]{1,40})\/void$/);
  if(m==='POST'&&r){need('void');return write(()=>voidSale(r[1],user));}
  if(m==='PUT'&&path==='/api/settings'){need('settings');return write(()=>saveSettings(b));}

  if(m==='GET'&&path==='/api/users'){
    need('users');
    const order={owner:0,manager:1,cashier:2};
    return DB.users.slice().sort((a,c)=>order[a.role]-order[c.role]||a.name.localeCompare(c.name,'id',{sensitivity:'base'})).map(userRow);
  }
  if(m==='POST'&&path==='/api/users'){
    need('users');
    const name=cleanName(b.name),username=cleanUser(b.username);
    if(ROLES.indexOf(b.role)<0)throw new ApiError(400,'Peran tidak valid');
    const pw=String(b.password||'');checkPw(pw);const h=await hashPw(pw);
    return write(()=>{
      if(DB.users.some(u=>u.username===username))throw new ApiError(409,'Username "'+username+'" sudah dipakai');
      const u={id:newId(),username,name,role:b.role,pw:h,active:1,createdAt:ms(),lastLogin:null};DB.users.push(u);return userRow(u);
    },false);
  }
  r=path.match(/^\/api\/users\/([A-Za-z0-9_-]{1,40})\/password$/);
  if(m==='POST'&&r){
    need('users');
    if(r[1]===user.id)throw new ApiError(400,'Untuk akun sendiri, pakai Ubah kata sandi di menu Atur');
    const pw=String(b.password||'');checkPw(pw);const h=await hashPw(pw);
    return write(()=>{const u=DB.users.find(x=>x.id===r[1]);if(!u)throw new ApiError(404,'Pengguna tidak ditemukan');u.pw=h;dropSessions(u.id);return {ok:true};},false);
  }
  r=path.match(/^\/api\/users\/([A-Za-z0-9_-]{1,40})\/logout$/);
  if(m==='POST'&&r){need('users');return write(()=>{const u=DB.users.find(x=>x.id===r[1]);if(!u)throw new ApiError(404,'Pengguna tidak ditemukan');dropSessions(u.id);return userRow(u);},false);}
  r=path.match(/^\/api\/users\/([A-Za-z0-9_-]{1,40})$/);
  if(m==='PUT'&&r){
    need('users');
    return write(()=>{
      const u=DB.users.find(x=>x.id===r[1]);if(!u)throw new ApiError(404,'Pengguna tidak ditemukan');
      let name=u.name,role=u.role,active=u.active;
      if('name' in b)name=cleanName(b.name);
      if('role' in b){if(ROLES.indexOf(b.role)<0)throw new ApiError(400,'Peran tidak valid');role=b.role;}
      if('active' in b)active=b.active?1:0;
      if(u.id===user.id&&(role!==u.role||active!==u.active))throw new ApiError(409,'Anda tidak bisa mengubah peran atau menonaktifkan akun sendiri');
      if(u.role==='owner'&&u.active&&(role!=='owner'||!active)&&otherOwners(u.id)===0)throw new ApiError(409,'Harus ada minimal satu pemilik yang aktif');
      u.name=name;u.role=role;u.active=active;if(!active)dropSessions(u.id);
      return userRow(u);
    },false);
  }
  if(m==='DELETE'&&r){
    need('users');
    return write(()=>{
      if(r[1]===user.id)throw new ApiError(409,'Anda tidak bisa menghapus akun sendiri');
      const u=DB.users.find(x=>x.id===r[1]);if(!u)throw new ApiError(404,'Pengguna tidak ditemukan');
      if(u.role==='owner'&&u.active&&otherOwners(u.id)===0)throw new ApiError(409,'Harus ada minimal satu pemilik yang aktif');
      dropSessions(u.id);DB.users=DB.users.filter(x=>x.id!==u.id);return {ok:true};
    },false);
  }
  throw new ApiError(404,'Alamat tidak ditemukan');
}

const json=(o,s)=>new Response(JSON.stringify(o),{status:s||200,headers:{'Content-Type':'application/json'}});
window.fetch=async function(url,opts){
  const u=String(url&&url.url||url);
  if(u.indexOf('/api/')!==0)return realFetch(url,opts);
  opts=opts||{};
  const method=String(opts.method||'GET').toUpperCase();
  const hd=opts.headers||{};const auth=hd['Authorization']||hd['authorization']||'';
  const tok=auth.indexOf('Bearer ')===0?auth.slice(7):'';
  let body={},raw=null;
  if(typeof Blob!=='undefined'&&opts.body instanceof Blob)raw=opts.body;
  else if(typeof opts.body==='string'&&opts.body){try{body=JSON.parse(opts.body);}catch(e){}}
  if(!body||typeof body!=='object')body={};
  try{
    const out=await handle(method,u.split('?')[0],body,raw,tok);
    if(out instanceof Blob)return new Response(out,{status:200,headers:{'Content-Type':'application/json'}});
    return json(out);
  }catch(e){
    if(e instanceof ApiError)return json(Object.assign({error:e.message},e.extra),e.status);
    console.error(e);return json({error:'Terjadi kesalahan di aplikasi'},500);
  }
};

function totals(){
  const lines=S.cart.map(l=>{const p=prod(l.pid);return p?{pid:l.pid,qty:l.qty,p,sub:p.price*l.qty}:null;}).filter(Boolean);
  const sub=lines.reduce((a,l)=>a+l.sub,0);
  const disc=S.discType==='pct'?Math.round(sub*Math.min(100,S.discVal)/100):Math.min(sub,S.discVal);
  const base=sub-disc;
  const tax=Math.round(base*(Store.settings.tax||0)/100);
  return {lines,sub,disc,base,tax,total:base+tax,count:lines.reduce((a,l)=>a+l.qty,0)};
}

/* ---------- receipt ---------- */
function receiptInner(s,st){
  const rows=s.items.map(i=>'<div class="r-item"><div>'+esc(i.name)+'</div><div class="r-line"><span>'+i.qty+' x '+num(i.price)+'</span><span>'+num(i.qty*i.price)+'</span></div></div>').join('');
  const line=(a,b,c)=>'<div class="r-line'+(c?' '+c:'')+'"><span>'+esc(a)+'</span><span>'+esc(b)+'</span></div>';
  return '<div class="r-c r-b">'+esc(st.store)+'</div>'
    +(st.addr?'<div class="r-c">'+esc(st.addr)+'</div>':'')
    +(st.phone?'<div class="r-c">'+esc(st.phone)+'</div>':'')
    +'<hr>'+line('No',s.no)+line('Tanggal',fmtDate(s.ts))+(s.cashier?line('Kasir',s.cashier):'')+'<hr>'+rows+'<hr>'
    +line('Subtotal',num(s.subtotal))
    +(s.discount?line('Diskon','-'+num(s.discount)):'')
    +(s.tax?line('PPN '+s.taxRate+'%',num(s.tax)):'')
    +line('TOTAL',num(s.total),'r-b r-total')
    +line(s.method,num(s.paid))
    +(s.method==='Tunai'?line('Kembali',num(s.change)):'')
    +'<hr><div class="r-c">'+esc(st.footer||'')+'</div>'
    +(s.void?'<div class="r-c r-b">*** DIBATALKAN ***</div>':'');
}
function wrapText(t,w){const o=[];t=String(t);while(t.length>w){o.push(t.slice(0,w));t=t.slice(w);}o.push(t);return o;}
function receiptText(s,st){
  const W=st.paper==80?48:32;const hr='-'.repeat(W);
  const ctr=t=>wrapText(t,W).map(x=>' '.repeat(Math.max(0,Math.floor((W-x.length)/2)))+x);
  const lr=(a,b)=>{a=String(a);b=String(b);const sp=Math.max(1,W-a.length-b.length);return a+' '.repeat(sp)+b;};
  const o=[...ctr(st.store)];
  if(st.addr)o.push(...ctr(st.addr));
  if(st.phone)o.push(...ctr(st.phone));
  o.push(hr,lr('No',s.no),lr('Tanggal',fmtDate(s.ts)));
  if(s.cashier)o.push(lr('Kasir',s.cashier));
  o.push(hr);
  s.items.forEach(i=>{o.push(...wrapText(i.name,W));o.push(lr(i.qty+' x '+num(i.price),num(i.qty*i.price)));});
  o.push(hr,lr('Subtotal',num(s.subtotal)));
  if(s.discount)o.push(lr('Diskon','-'+num(s.discount)));
  if(s.tax)o.push(lr('PPN '+s.taxRate+'%',num(s.tax)));
  o.push(lr('TOTAL',num(s.total)),lr(s.method,num(s.paid)));
  if(s.method==='Tunai')o.push(lr('Kembali',num(s.change)));
  o.push(hr,...ctr(st.footer||''));
  if(s.void)o.push(...ctr('*** DIBATALKAN ***'));
  return o.join('\n');
}

  const st=s.st||Store.settings;const p=st.paper||58;
  return '<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Struk '+esc(s.no)+'</title><style>@page{size:'+p+'mm auto;margin:0}body{margin:0;background:#e9ecea}'
    +$('#receipt-css').textContent
    +'.bar{display:flex;justify-content:center;padding:14px}.bar button{font:600 16px system-ui,sans-serif;height:46px;padding:0 24px;border-radius:12px;border:0;background:#0d6e5b;color:#fff}@media print{body{background:#fff}.bar{display:none}.receipt{margin:0}}</style></head><body><div class="bar"><button onclick="window.print()">Cetak</button></div><div class="receipt" style="--paper:'+p+'mm">'
    +receiptInner(s,st)+'</div></body></html>';

/* ---------- events ---------- */
async function onAct(act,el,ev){
  const id=el.dataset.id,v=el.dataset.v;
  switch(act){
    case 'nav':S.view=v;S.cartOpen=false;if(v==='users')S.users=null;render();if(v==='users')loadUsers();break;
    case 'user-new':openUser(null);break;
    case 'user-edit':openUser(id);break;
    case 'user-pw':openUserPw(id);break;
    case 'user-del':if(confirmTap(el,'Yakin hapus?')){
      try{await Store.api('DELETE','/api/users/'+id);}catch(e){toast(errMsg(e));break;}
      closeModal();toast('Pengguna dihapus');loadUsers();}break;
    case 'user-out':
      try{await Store.api('POST','/api/users/'+id+'/logout',{});}catch(e){toast(errMsg(e));break;}
      closeModal();toast('Pengguna dikeluarkan dari semua perangkat');loadUsers();break;
    case 'my-pw':openMyPw();break;
    case 'logout':doLogout();break;
    case 'forgot':openForgot();break;
    case 'new-recovery':openNewRecovery();break;
    case 'rec-ok':if(confirmTap(el,'Yakin sudah dicatat?'))closeModal();break;
    case 'copy-rec':{const c=$('#recCode');try{await navigator.clipboard.writeText(c.textContent);toast('Kode disalin');}catch(e){toast('Tahan lalu salin kodenya secara manual');}break;}
    case 'cat':S.cat=v;render();break;
    case 'scat':S.scat=v;render();break;
    case 'low':S.low=!S.low;render();break;
    case 'range':S.range=v;render();break;
    case 'add':addToCart(id);break;
    case 'inc':{const l=S.cart.find(x=>x.pid===id),p=prod(id);if(l&&p){if(l.qty+1>p.stock)toast('Stok '+p.name+' tinggal '+p.stock);else{l.qty++;render();}}break;}
    case 'dec':{const l=S.cart.find(x=>x.pid===id);if(l){l.qty--;if(l.qty<=0)S.cart=S.cart.filter(x=>x!==l);render();}break;}
    case 'rm':S.cart=S.cart.filter(x=>x.pid!==id);render();break;
    case 'clear-cart':if(confirmTap(el,'Yakin?')){S.cart=[];S.discVal=0;S.paid=0;render();}break;
    case 'disc-type':S.discType=v;render();break;
    case 'method':S.method=v;render();break;
    case 'quick':S.paid=toInt(v);render();break;
    case 'pay':checkout();break;
    case 'cart-open':S.cartOpen=true;render();break;
    case 'cart-close':S.cartOpen=false;render();break;
    case 'new-product':openProduct(null);break;
    case 'edit':openProduct(id);break;
    case 'restock':openRestock(id);break;
    case 'rmode':M.rmode=v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));restockPreview();break;
    case 'del-product':if(confirmTap(el,'Yakin hapus?')){
      try{await Store.delProduct(id);}catch(e){toast(errMsg(e));break;}
      S.cart=S.cart.filter(x=>x.pid!==id);closeModal();toast('Produk dihapus');render();}break;
    case 'seed':
      try{await Store.seed();toast('Produk contoh dimuat');}catch(e){toast(errMsg(e));}break;
    case 'del-examples':if(confirmTap(el,'Yakin hapus?')){
      try{await Store.delExamples();toast('Produk contoh dihapus');}catch(e){toast(errMsg(e));}}break;
    case 'sale':{const s=Store.sales.find(x=>x.id===id);if(s)openReceipt(s,false);break;}
    case 'print':doPrint();break;
    case 'retry':boot();break;
    case 'backup':backup();break;
    case 'restore-pick':{const i=$('#restoreFile');if(i)i.click();break;}
    case 'restore-go':doRestore(el);break;
    case 'copy-receipt':copyReceipt();break;
    case 'void':if(confirmTap(el,'Yakin batalkan? Stok kembali'))voidSale();break;
    case 'close-modal':closeModal();break;
    case 'overlay':if(ev.target===el)closeModal();break;
    case 'save-settings':saveSettings();break;
    case 'export-csv':exportCSV();break;
  }
}

const csvq=v=>{v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
async function exportCSV(){
  const rows=[['No','Tanggal','Kasir','Metode','Produk','Qty','Harga','Jumlah','Diskon transaksi','PPN','Total transaksi','Status']];
  rangeSales().forEach(s=>s.items.forEach((it,i)=>rows.push([s.no,fmtDate(s.ts),s.cashier||'',s.method,it.name,it.qty,it.price,it.qty*it.price,i?'':s.discount,i?'':s.tax,i?'':s.total,s.void?'Batal':'Selesai'])));
  const csv='﻿'+rows.map(r=>r.map(csvq).join(',')).join('\r\n');
  try{await saveFile('penjualan-'+dayKey(Date.now())+'.csv',csv,'text/csv');toast('File CSV disimpan');}
  catch(e){if(!e||e.code!=='declined')toast('File tidak bisa disimpan di sini');}

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){S.q=t.value;render();}
  else if(t.id==='sq'){S.sq=t.value;render();}
  else if(t.id==='discIn'){S.discVal=toInt(t.value);render();}
  else if(t.id==='paidIn'){
    S.paid=toInt(t.value);t.value=S.paid?num(S.paid):'';
    const tt=totals();const diff=S.paid-tt.total;const co=$('#changeOut');
    if(co){co.textContent=S.paid>0&&diff<0?'Kurang '+rp(-diff):rp(Math.max(0,diff));co.classList.toggle('short',S.paid>0&&diff<0);}
    const pb=$('#payBtn');if(pb)pb.disabled=!canPay(tt);
  }
  else if(t.id==='r-qty'){restockPreview();}
  else if(t.classList&&t.classList.contains('qty')){
    const l=S.cart.find(x=>x.pid===t.dataset.id),p=prod(t.dataset.id);if(!l||!p)return;
    const raw=t.value.replace(/\D/g,'');
    if(raw===''){t.value='';return;}
    let n=parseInt(raw,10);
    if(n>p.stock){n=p.stock;toast('Stok '+p.name+' tinggal '+p.stock);}
    if(n<=0)return;
    l.qty=n;render();
  }
});

async function backup(){
  try{
    const r=await fetch('/api/backup',{headers:Store.headers()});if(!r.ok)throw new Error('x');
    const blob=await r.blob();const bname='kasirku-'+dayKey(Date.now())+'.json';
    try{
      const bf=new File([blob],bname,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[bf]})){await navigator.share({files:[bf],title:bname});Store.refresh().catch(()=>{});toast('Cadangan dibagikan');return;}
    }catch(e){if(e&&e.name==='AbortError')return;}
    saveFile(bname,blob,'application/json');
    Store.refresh().catch(()=>{});toast('Cadangan diunduh');
  }catch(e){toast('Cadangan gagal diunduh');}
}

  restoreFile=file;
  openModal('<div class="sheet" role="dialog" aria-label="Pulihkan data"><h2>Pulihkan dari cadangan?</h2>'
    +'<p style="margin:0">Semua produk, stok, dan riwayat penjualan yang ada sekarang akan <b>diganti</b> dengan isi file <b>'+esc(file.name)+'</b> ('+Math.max(1,Math.round(file.size/1024))+' KB).</p>'
    +'<p class="hint">Sebelum diganti, iPad menyimpan satu salinan data saat ini. Akun pengguna tidak ikut berubah.</p>'
    +'<div class="actions"><span class="sp"></span><button class="btn ghost" data-act="close-modal">Batal</button><button class="btn danger" data-act="restore-go">Ganti semua data</button></div></div>');
}
async function doRestore(btn){
  const f=restoreFile;if(!f)return;
  btn.disabled=true;btn.textContent='Memulihkan…';
  try{
    const hd=Store.headers();hd['Content-Type']='application/octet-stream';
    const r=await fetch('/api/restore',{method:'POST',headers:hd,body:f});
    let d=null;try{d=await r.json();}catch(e){}
    if(!r.ok)throw new Error((d&&d.error)||('Gagal memulihkan (kode '+r.status+')'));
    restoreFile=null;S.cart=[];S.saleId=null;S.discVal=0;S.paid=0;
    await Store.refresh();closeModal();
    toast('Data dipulihkan: '+d.products+' produk, '+d.sales+' transaksi');
  }catch(e){
    btn.disabled=false;btn.textContent='Ganti semua data';
    toast(e instanceof TypeError?'Gagal memulihkan. Periksa koneksi.':(e.message||'Gagal memulihkan'));
  }
}
document.addEventListener('change',ev=>{
  const t=ev.target;if(!t||t.id!=='restoreFile')return;
  const f=t.files&&t.files[0];t.value='';
  if(f)confirmRestore(f);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)Store.poll();});
setInterval(()=>Store.poll(),5000);
boot();
})();
</script>
